name: G4 Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  g4-review:
    name: G4 Enforcement Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Run Review Agent
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python scripts/g4_review_agent.py \
            --pr-number "$PR_NUMBER" \
            --base-sha "dummy" \
            --head-sha "dummy" \
            --risk-tier "MED" \
            --output review.json
      
      - name: G4 Enforcement Gate
        run: |
          python scripts/enforce_g4.py review.json
      
      - name: Upload Review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ github.event.pull_request.number }}
          path: |
            review.json
            artifacts/